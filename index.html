<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Labo de l'électricité</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;700;800&display=swap">
<style>
/* Concept : cahier de labo — cartes colorées par famille (statique orange, dynamique bleu, bonus violet), grande scène de simulation + panneau de notes */
:root{--bg:#eef3f9;--surface:#fff;--ink:#14213d;--muted:#566179;--line:#d5deea;--stat:#c2410c;--stat-soft:#fdeadd;--dyn:#1c5fd0;--dyn-soft:#e3edfc;--bon:#6741d9;--bon-soft:#ebe5fb;--ok:#1f9d55;--warn:#c2410c;--on:#fff;--stage:#eaf2fc;--wall:#d9d2c7;--wallline:#c4bcae;
--fd:'Fredoka','Trebuchet MS',sans-serif;--fb:'Nunito Sans','Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#162238;--ink:#e8eefb;--muted:#9db0cc;--line:#2a3a58;--stat:#ff9a62;--stat-soft:#3a2417;--dyn:#6ea8ff;--dyn-soft:#172c52;--bon:#b39bff;--bon-soft:#2a2250;--ok:#4cd68a;--warn:#ff9a62;--on:#0e1626;--stage:#12233f;--wall:#3a3f4d;--wallline:#2e3340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#162238;--ink:#e8eefb;--muted:#9db0cc;--line:#2a3a58;--stat:#ff9a62;--stat-soft:#3a2417;--dyn:#6ea8ff;--dyn-soft:#172c52;--bon:#b39bff;--bon-soft:#2a2250;--ok:#4cd68a;--warn:#ff9a62;--on:#0e1626;--stage:#12233f;--wall:#3a3f4d;--wallline:#2e3340;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--fb);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.brand{font:600 24px var(--fd);color:var(--ink);text-decoration:none;display:flex;gap:10px;align-items:center}
.brand svg{width:30px;height:30px}
button,.btn{font:700 16px var(--fb);min-height:44px;padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--ck,var(--dyn))}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--ck,var(--dyn));outline-offset:2px}
.btn.pri,button.pri{background:var(--ck,var(--dyn));color:var(--on);border-color:var(--ck,var(--dyn))}
button:disabled{opacity:.5;cursor:not-allowed}
button.on{background:var(--ck,var(--dyn));color:var(--on);border-color:var(--ck,var(--dyn))}
h1,h2,h3{font-family:var(--fd);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,46px);line-height:1.1}
h2{font-size:26px;margin:32px 0 6px}
.lead{max-width:62ch;color:var(--muted);margin:10px 0 0}
.sect-note{color:var(--muted);margin:0 0 14px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--ck)}
.card .th{background:var(--soft);height:104px;display:flex;align-items:center;justify-content:center;position:relative}
.card .th svg{height:92px;width:auto;max-width:100%}
.card .body{padding:12px 16px 16px}
.card .num{font:700 13px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--ck)}
.card h3{font-size:21px;margin:2px 0 4px}
.card p{margin:0;color:var(--muted);font-size:15px}
.done{position:absolute;top:8px;right:8px;background:var(--ok);color:var(--on);border-radius:99px;font:700 13px var(--fb);padding:2px 10px}
.k-stat{--ck:var(--stat);--soft:var(--stat-soft)}.k-dyn{--ck:var(--dyn);--soft:var(--dyn-soft)}.k-bon{--ck:var(--bon);--soft:var(--bon-soft)}
.safety{margin-top:28px;border:2px dashed var(--line);border-radius:14px;padding:12px 16px;color:var(--muted)}
.crumb{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.crumb a{color:var(--ck);font-weight:700}
.exp h1{font-size:clamp(28px,4vw,38px)}
.tag{font:700 13px var(--fb);letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--ck);padding:3px 10px;border-radius:99px}
.expgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;margin-top:14px;align-items:start}
@media(max-width:920px){.expgrid{grid-template-columns:minmax(0,1fr)}}
.stage{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--stage)}
.stage svg.sim{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.stage .bg{fill:var(--stage)}
.stage .wall{fill:var(--wall)}.stage .wallline{stroke:var(--wallline);stroke-width:2}
.stage text.lbl{fill:var(--ink);font:700 15px var(--fb)}
.stage text.hint{fill:var(--muted);font:700 17px var(--fb)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 4px 0}
.ctrls .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrls label{font-weight:700;color:var(--muted)}
.status{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);min-height:48px}
.status.good{border-color:var(--ok)}.status.bad{border-color:var(--warn)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:19px;color:var(--ck);margin-bottom:4px}
.panel ul,.panel ol{margin:0;padding-left:22px}.panel li{margin:3px 0}
.panel textarea{width:100%;min-height:96px;font:16px var(--fb);padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.reveal{background:var(--soft);border-radius:12px;padding:12px 14px}
.reveal p{margin:4px 0 10px}
.safe{background:var(--dyn-soft);border-radius:10px;padding:8px 12px;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:12px}
.tray button{flex-direction:column;padding:6px;font-size:14px;gap:2px}
.tray svg{width:70px;height:46px}
table.res{border-collapse:collapse;width:100%;margin-top:12px;font-size:15px}
table.res td,table.res th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.tablewrap{overflow-x:auto}
.qbox{padding:20px;display:flex;flex-direction:column;gap:12px;min-height:360px;background:var(--surface)}
.qbox .q{font:600 24px var(--fd)}
.qbox .opts{display:grid;gap:10px}
.qbox .opts button{justify-content:flex-start;text-align:left;font-size:17px}
.qbox .opts button.right{background:var(--ok);color:var(--on);border-color:var(--ok)}
.qbox .opts button.wrong{border-color:var(--warn);color:var(--warn)}
.cv{min-height:calc(100vh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:20px}
.cv .art{width:min(560px,100%);height:auto;border-radius:24px;background:var(--stage);border:2px solid var(--line)}
.cv h1{font-size:clamp(36px,7vw,64px)}
.cv .sub{font:600 clamp(18px,3vw,24px) var(--fd);color:var(--dyn);margin:0}
.cv .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cv .chip{padding:4px 14px;border-radius:99px;font-weight:700;font-size:15px}
.cv .go{font-size:22px;min-height:56px;padding:10px 34px;border-radius:14px;--ck:var(--dyn)}
.cv input{font:700 18px var(--fb);min-height:46px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:min(280px,100%);text-align:center}
body.cover header.top{display:none}
.spk{min-height:40px;padding:4px 14px;border-radius:99px;font-size:15px;gap:8px;color:var(--ck,var(--dyn));font-family:var(--fb);text-transform:none;letter-spacing:0}
.spk svg{width:20px;height:20px;fill:currentColor}
.spk.on{color:var(--on)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#vnote{position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:auto;background:var(--surface);border:2px solid var(--warn);border-radius:14px;padding:12px 16px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header select{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--fb);max-width:200px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="#debut"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#ffb703"/><path d="M18 4 8 18h7l-2 10 11-15h-7z" fill="#14213d"/></svg>Labo de l'électricité</a>
<span style="display:flex;gap:8px;align-items:center"><span id="voiceBox"></span><button id="themeBtn" type="button" aria-label="Changer le thème">Thème</button></span></header>
<main id="app"></main>
</div>
<script>
(function(){'use strict';
const NS='http://www.w3.org/2000/svg';
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function S(tag,at,parent){const e=document.createElementNS(NS,tag);for(const k in (at||{}))e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e}
function H(tag,at,html,parent){const e=document.createElement(tag);for(const k in (at||{})){if(k==='class')e.className=at[k];else e.setAttribute(k,at[k])}if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function pt(svg,ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:q.x,y:q.y}}
function drag(node,svg,h){node.style.touchAction='none';node.style.cursor='grab';

  h.start&&h.start(pt(svg,e),e);node.style.cursor='grabbing';
  const mv=ev=>{h.move&&h.move(pt(svg,ev),ev)};
  const up=ev=>{node.removeEventListener('pointermove',mv);node.removeEventListener('pointerup',up);node.removeEventListener('pointercancel',up);node.style.cursor='grab';h.end&&h.end(pt(svg,ev),ev)};
  node.addEventListener('pointermove',mv);node.addEventListener('pointerup',up);node.addEventListener('pointercancel',up)})}
function glyph(parent,sign,r){r=r||7;const g=S('g',{},parent);S('circle',{r:r,fill:sign>0?'#e5383b':'#2b6cff'},g);
 const t=S('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':r*1.7,fill:'#fff','font-weight':'800','font-family':'Nunito Sans,Arial,sans-serif'},g);t.textContent=sign>0?'+':'−';g.style.pointerEvents='none';return g}
function place(g,x,y){g.setAttribute('transform','translate('+x+','+y+')')}
function show(g,v){g.style.display=v?'':'none'}
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function shuffle(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function btn(label,fn,parent,cls){const b=H('button',{type:'button',class:cls||''},label,parent);b.addEventListener('click',fn);return b}
function segmented(parent,label,opts,val,fn){const w=H('div',{class:'grp'},'',parent);if(label)H('label',{},label,w);const bs=[];
 opts.forEach(([v,t])=>{const b=btn(t,()=>{bs.forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(v)},w);if(v===val)b.classList.add('on');bs.push(b)});return w}
const EXPS=[];
const TTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';let spkBtn=null,spkId=0;
let VOICES=[];const frV=()=>VOICES.filter(x=>/^fr/i.test(x.lang));
function pickVoice(){const f=frV(),n=store.get('labo-voice','');return f.find(x=>x.name===n)||f.find(x=>/^fr[-_]CA/i.test(x.lang))||f.find(x=>/google/i.test(x.name))||f[0]||null}
function fillV(){const b=document.getElementById('voiceBox');if(!b)return;b.innerHTML='';const f=frV();if(f.length<2)return;const sel=H('select',{id:'voiceSel','aria-label':'Choisir la voix'},'',b);f.forEach(x=>H('option',{value:x.name},x.name+' ('+x.lang+')',sel));const c=pickVoice();if(c)sel.value=c.name;sel.addEventListener('change',()=>store.set('labo-voice',sel.value))}
function loadV(){if(!TTS)return;VOICES=speechSynthesis.getVoices();fillV()}
function showNote(){if(document.getElementById('vnote'))return;const d=H('div',{id:'vnote',role:'alert'},'<b>Pas de voix fran\u00e7aise sur cet appareil.</b><span>La lecture se fera avec une voix anglaise. Sur Chromebook : Param\u00e8tres, Accessibilit\u00e9, Texte en voix, puis installe les donn\u00e9es vocales du fran\u00e7ais.</span>',document.body);btn('Fermer',()=>d.remove(),d)}
if(TTS){loadV();speechSynthesis.addEventListener('voiceschanged',loadV)}
function stopSpeak(){spkId++;if(TTS)try{speechSynthesis.cancel()}catch(e){}if(spkBtn){spkBtn.classList.remove('on');spkBtn.setAttribute('aria-pressed','false');spkBtn=null}}
function say(text,b){if(!TTS)return;if(spkBtn===b&&b){stopSpeak();return}stopSpeak();const id=spkId;
 if(!VOICES.length)VOICES=speechSynthesis.getVoices();const v=pickVoice();if(!v)showNote();
 const parts=String(text).replace(/\s+/g,' ').split(/(?<=[.!?:;])\s+/).filter(x=>x.trim());
 if(b){b.classList.add('on');b.setAttribute('aria-pressed','true');spkBtn=b}
 parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang:'fr-FR';if(v)u.voice=v;u.rate=.85;
  if(i===parts.length-1)u.onend=u.onerror=()=>{if(spkId===id&&spkBtn===b&&b){b.classList.remove('on');b.setAttribute('aria-pressed','false');spkBtn=null}};
  speechSynthesis.speak(u)})}
function spk(parent,getText,label){if(!TTS)return null;
 const b=H('button',{type:'button',class:'spk','aria-label':label||'\u00c9couter','aria-pressed':'false'},'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>\u00c9couter',parent);
 b.addEventListener('click',()=>say(typeof getText==='function'?getText():getText,b));return b}
function hspk(block,getText){const h=block.querySelector('h3');if(!h||!TTS)return;h.classList.add('hrow');spk(h,getText)}
/* ---- usines de dessin ---- */
function makeSweater(parent,x,y){
 const g=S('g',{transform:'translate('+x+','+y+')'},parent);
 S('path',{d:'M40 20 L100 0 Q120 28 140 0 L200 20 L240 130 L200 145 L185 105 L185 300 L55 300 L55 105 L40 145 L0 130 Z',fill:'#c8553d'},g);
 S('rect',{x:55,y:282,width:130,height:18,fill:'#a8402b'},g);
 S('path',{d:'M100 0 Q120 28 140 0',fill:'none',stroke:'#a8402b','stroke-width':8},g);
 for(let i=0;i<5;i++)S('line',{x1:57,x2:183,y1:40+i*48,y2:40+i*48,stroke:'#b84a33','stroke-width':3},g);
 const P=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)P.push([62+c*31,62+r*54]);
 const pos=[],neg=[];P.forEach(p=>{const a=glyph(g,1,6);place(a,p[0],p[1]);pos.push(a);const b=glyph(g,-1,6);place(b,p[0]+13,p[1]+11);neg.push(b)});
 const rank=[];shuffle(P.map((_,i)=>i),7).forEach((idx,k)=>rank[idx]=k);
 function update(t,mode){P.forEach((_,i)=>{const rem=rank[i]<t;
  show(pos[i],mode==='all'||(mode==='diff'&&rem));show(neg[i],mode==='all'&&!rem)})}
 update(0,'all');return{g:g,x:x,y:y,w:240,h:300,update:update}}
function makeBalloon(parent){
 const g=S('g',{},parent);
 S('path',{d:'M0 78 C 12 108 -12 130 0 165',fill:'none',stroke:'#7b8499','stroke-width':2},g);
 S('ellipse',{rx:55,ry:70,fill:'#e63946'},g);
 S('ellipse',{cx:-26,cy:-30,rx:10,ry:18,fill:'#fff',opacity:.28,transform:'rotate(25 -26 -30)'},g);
 S('path',{d:'M-7 71 L7 71 L0 82 Z',fill:'#b3202c'},g);
 let slots=[];for(let yy=-56,row=0;yy<=56;yy+=16,row++)for(let xx=-48;xx<=48;xx+=17){const x=xx+(row%2?8:0);if((x/45)**2+(yy/61)**2<=1)slots.push([x,yy])}
 slots=shuffle(slots,3);const n=Math.min(10,Math.floor(slots.length/3));
 const pos=[],neg=[],ext=[];
 for(let i=0;i<n;i++){const a=glyph(g,1,6);place(a,slots[i*2][0],slots[i*2][1]);pos.push(a);const b=glyph(g,-1,6);place(b,slots[i*2+1][0],slots[i*2+1][1]);neg.push(b)}
 for(let i=0;i<n;i++){const e=glyph(g,-1,6);place(e,slots[2*n+i][0],slots[2*n+i][1]);ext.push(e)}
 function update(t,mode){for(let i=0;i<n;i++){show(pos[i],mode==='all');show(neg[i],mode==='all');show(ext[i],mode!=='none'&&i<t)}}

 return{g:g,maxT:n,setPos:(x,y)=>place(g,x,y),update:update}}
/* ---- contexte d'une expérience ---- */
let destroyers=[];
function cleanup(){stopSpeak();destroyers.forEach(f=>{try{f()}catch(e){}});destroyers=[]}
function makeCtx(stageBox,ctrlBox,statusBox,title){
 const c={ctrl:ctrlBox,status(t,k){statusBox.textContent=t;statusBox.className='status '+(k||'')},
 svg(){const s=S('svg',{viewBox:'0 0 800 500',role:'img','aria-label':title});s.setAttribute('class','sim');stageBox.appendChild(s);S('rect',{class:'bg',width:800,height:500},s);return s},
 box(){return stageBox},
 loop(fn){let last=performance.now(),id;const f=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt,t/1000);id=requestAnimationFrame(f)};id=requestAnimationFrame(f);destroyers.push(()=>cancelAnimationFrame(id))},
 on(fn){destroyers.push(fn)},done(){}};return c}
/* ---- Centre 1 : ballon et mur ---- */
function mountBallon(ctx){
 const svg=ctx.svg(),WX=610;
 S('rect',{x:WX,y:0,width:800-WX,height:500,class:'wall'},svg);
 for(let y=0;y<500;y+=48)S('line',{x1:WX,x2:800,y1:y,y2:y,class:'wallline'},svg);
 const sw=makeSweater(svg,30,110);
 S('text',{x:150,y:440,'text-anchor':'middle',class:'lbl'},svg).textContent='Pull en laine';
 S('text',{x:700,y:490,'text-anchor':'middle',class:'lbl'},svg).textContent='Mur';
 const wp=[],wn=[];
 for(let r=0;r<10;r++)for(let c=0;c<2;c++){const x=WX+36+c*80,y=26+r*48;const a=glyph(svg,1,6);place(a,x,y);const b=glyph(svg,-1,6);place(b,x+17,y);wp.push([a,x,y]);wn.push([b,x+17,y])}
 const bal=makeBalloon(svg);
 const hint=S('text',{x:400,y:40,'text-anchor':'middle',class:'hint'},svg);hint.textContent='Glisse le ballon sur le pull pour le frotter';
 let t=0,mode='all',bx=420,by=260,vx=0,dragging=false,ox=0,oy=0,acc=0,last=null;
 function render(){
  bal.setPos(bx,by);sw.update(t,mode);bal.update(t,mode);
  const gap=WX-(bx+55),pol=(t/bal.maxT)*clamp(1-Math.max(gap,0)/230,0,1);
  wp.forEach(w=>{show(w[0],mode==='all');const k=Math.exp(-(((w[2]-by)/130)**2));place(w[0],w[1]-pol*4*k,w[2])});
  wn.forEach(w=>{show(w[0],mode==='all');const k=Math.exp(-(((w[2]-by)/130)**2));place(w[0],w[1]+pol*26*k,w[2])});
  readout.textContent=t===0?'Ballon neutre : autant de + que de −.':'Le ballon a '+t+' électron'+(t>1?'s':'')+' en trop : il est négatif.';

 nmI.addEventListener('input',upd);upd();const cvb=spk(document.querySelector('.cv'),()=>'Bienvenue au labo de l\u2019\u00e9lectricit\u00e9. Frotte, branche, teste et d\u00e9couvre comment fonctionne l\u2019\u00e9lectricit\u00e9. Appuie sur le bouton Commencer.','\u00c9couter');if(cvb)document.querySelector('.cv').insertBefore(cvb,document.getElementById('go'))}
function route(){cleanup();const h=location.hash.slice(1),e=EXPS.find(x=>x.id===h);document.body.classList.toggle('cover',!e&&h!=='accueil');try{e?page(e):(h==='accueil'?home():cover())}catch(err){app.innerHTML='<p>Erreur : '+err.message+'</p>';console.error(err)}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
const tb=document.getElementById('themeBtn'),root=document.documentElement;
const th=store.get('labo-theme','');if(th)root.setAttribute('data-theme',th);
tb.addEventListener('click',()=>{const d=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);const v=d?'light':'dark';root.setAttribute('data-theme',v);store.set('labo-theme',v)});
route();
})();
</script>
</body>
